# Prometheus scrape config for the pre-auth gateway.
#
# The gateway runs on the Windows host; Prometheus runs in WSL. From inside WSL
# the host is reachable on the default gateway address, which is why the target
# is not `localhost` -- `localhost` inside the VM is the VM.
#
# A 5s scrape interval is deliberate and is not a production setting. The alert
# rules use 5m and 15m windows, so at a 15s interval a rule needs minutes of
# real time before it can fire, and a drill that takes minutes is a drill nobody
# runs. Anything shorter than the rule's own `for` clause still cannot make it
# fire early -- it only makes the series dense enough to be worth evaluating.

global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: preauth-gateway
    metrics_path: /metrics
    static_configs:
      - targets:
          - "GATEWAY_TARGET"
